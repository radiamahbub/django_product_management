{% extends 'master/base.html' %}


{% block title %}
    Add Product
{% endblock title %}
    

{% block content %}
   <div class="container">
        <h1 class="m-4 text-center">Product Management System</h1>

        <p class="m-2 text-center">
            <i class="bi bi-bag-check-fill"></i> Add Products Here
        </p>

        <form method="POST" enctype="multipart/form-data" class="mb-5">
            {% csrf_token %}

            <div class="mb-3">
                <label for="productImage" class="form-label">Product Image</label>
                <input type="file" name="image" class="form-control" id="productImage">
            </div>

            <div class="mb-3">
                <label for="productName" class="form-label">Product Name</label>
                <input type="text" name="name" class="form-control" id="productName">
            </div>

            <div class="mb-3">
                <label for="productDescription" class="form-label">Product Description</label>
                <textarea name="description" class="form-control" id="productDescription" rows="4"></textarea>
            </div>

            <div class="mb-3">
                <label for="productPrice" class="form-label">Product Price</label>
                <input type="number" name="price" class="form-control" id="productPrice" step="0.01" min="0">
            </div>

            <div class="mb-3">
                <label for="productionDate" class="form-label">Production Date</label>
                <input type="date" name="production_date" class="form-control" id="productionDate">
            </div>

             <div class="mb-3">
                <label for="productType" class="form-label">Product Type</label>
                <select class="form-select" name="product_type" aria-label="Default select example"  id="productType">
                <option selected>Select from here</option>
                <option value="Gadgets">Gadgets</option>
                <option value="Devices">Devices</option>
                <option value="Robots">Robots</option>
                </select>
            </div>

            <div class="d-grid gap-2">
            <button type="submit" class="btn btn-outline-primary text-primary">
                Submit
            </button>
            </div>
        </form>
    </div>
{% endblock content %}
