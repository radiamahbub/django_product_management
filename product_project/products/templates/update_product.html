{% extends 'master/base.html' %}


{% block title %}
    Update Product
{% endblock title %}
    

{% block content %}
   <div class="container">
        <h1 class="m-4 text-center">Product Management System</h1>

        <p class="m-2 text-center">
            <i class="bi bi-bag-check-fill"></i> Update Products Here
        </p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label for="productImage" class="form-label">Product Image</label>
                {% if product_data.image %}
                    <img src="/{{product_data.image}}" width="100px" alt="" class="m-2">
                {% else %}
                    No preview    
                {% endif %}
                <input type="file" name="image" class="form-control" id="productImage">
            </div>

            <div class="mb-3">
                <label for="productName" class="form-label">Product Name</label>
                <input type="text" name="name" value="{{product_data.name}}" class="form-control" id="productName">
            </div>

            <div class="mb-3">
                <label for="productDescription" class="form-label">Product Description</label>
                <textarea name="description" class="form-control" id="productDescription" rows="4">{{product_data.description}}</textarea>
            </div>

            <div class="mb-3">
                <label for="productPrice" class="form-label">Product Price</label>
                <input type="number" name="price" value="{{product_data.price}}" class="form-control" id="productPrice" step="0.01" min="0">
            </div>

            <div class="mb-3">
                <label for="productionDate" class="form-label">Production Date</label>
                <input type="date" name="production_date" value="{{product_data.production_date|date:'Y-m-d'}}" class="form-control" id="productionDate">
            </div>

            <div class="mb-3">
                <label for="productType" class="form-label">Product Type</label>
                <select class="form-select" name="product_type" aria-label="Default select example"  id="productType">
                <option>Select from here</option>
                <option value="Gadgets"
                {% if product_data.product_type == 'Gadgets' %}
                    selected
                {% endif %}>Gadgets</option>

                <option value="Devices"
                {% if product_data.product_type == 'Devices' %}
                    selected
                {% endif %}
                    >Devices</option>

                <option value="Robots"
                {% if product_data.product_type == 'Robots' %}
                    selected
                {% endif %}
                    >Robots</option>
                </select>
            </div>

            <div class="d-grid gap-2">
            <button type="submit" class="btn btn-outline-info text-info">
                Edit
            </button>
        </div>
        </form>
    </div>
{% endblock content %}
